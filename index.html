<title>Tempora</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=DM+Sans:opsz,wght@9..40,400..700&display=swap">
<style>
/* Layout: la mappa occupa tutto lo schermo; sopra, tre lastre di carta (testata, pannello, linea del tempo). Design system: Fornace. */
:root {
  --carta: #f7f1e6;
  --carta-scura: #ece2d0;
  --filo: #d9cbb4;
  --inchiostro: #2a211a;
  --inchiostro-tenue: #6b5a4c;
  --terracotta: #a84a28;
  --terracotta-chiara: #f0d6c6;
  --oliva: #56622f;
  --ocra: #b8862a;
  --mare: #dfe0d4;
  --mare-filo: #c9c6b3;
  --terra: #ece4d2;
  --lastra: rgba(247, 241, 230, 0.94);
  --f-display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  --f-testo: "Source Serif 4", Georgia, serif;
  --f-ui: "DM Sans", system-ui, sans-serif;
  --r-sm: 2px; --r-md: 6px; --r-lg: 12px;
  --s1: 4px; --s2: 8px; --s3: 16px; --s4: 24px; --s5: 40px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --carta: #1a1612; --carta-scura: #241e18; --filo: #3d332a; --inchiostro: #f2e9dc; --inchiostro-tenue: #b9a894;
    --terracotta: #e2906a; --terracotta-chiara: #4a2a1c; --oliva: #b3bf7f; --ocra: #d9a94c;
    --mare: #121518; --mare-filo: #232a2f; --terra: #2b251f; --lastra: rgba(26, 22, 18, 0.93);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --carta: #1a1612; --carta-scura: #241e18; --filo: #3d332a; --inchiostro: #f2e9dc; --inchiostro-tenue: #b9a894;
  --terracotta: #e2906a; --terracotta-chiara: #4a2a1c; --oliva: #b3bf7f; --ocra: #d9a94c;
  --mare: #121518; --mare-filo: #232a2f; --terra: #2b251f; --lastra: rgba(26, 22, 18, 0.93);
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; }
[hidden] { display: none !important; }
body { background: var(--carta); color: var(--inchiostro); font-family: var(--f-ui); overflow: hidden; }
* { box-sizing: border-box; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--terracotta); outline-offset: 2px; }

#app { position: fixed; inset: 0; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
#map.dragging { cursor: grabbing; }
.lastra { background: var(--lastra); border: 1px solid var(--filo); border-radius: var(--r-lg); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.etichetta { font: 600 11px/14px var(--f-ui); letter-spacing: 0.1em; text-transform: uppercase; color: var(--inchiostro-tenue); }

/* Testata */
#testata { position: absolute; top: calc(env(safe-area-inset-top, 0px) + var(--s3)); left: calc(env(safe-area-inset-left, 0px) + var(--s3)); padding: var(--s3) var(--s4) var(--s3); min-width: 280px; display: grid; gap: var(--s1); }
.marchio { display: flex; align-items: baseline; gap: var(--s2); }
.marchio b { font: 800 19px/1 var(--f-display); letter-spacing: -0.02em; }
.marchio b i { font-style: normal; color: var(--terracotta); }
.marchio span { font-size: 12px; color: var(--inchiostro-tenue); }
.anno { display: flex; align-items: baseline; gap: 10px; margin-top: var(--s2); }
.anno strong { font: 800 64px/0.9 var(--f-display); letter-spacing: -0.045em; font-variant-numeric: tabular-nums; }
.anno em { font: 600 16px var(--f-display); font-style: normal; color: var(--terracotta); }
.era { font: italic 400 16px/22px var(--f-testo); color: var(--inchiostro-tenue); }
.mappa-di { margin-top: var(--s1); }

/* Strumenti */
#strumenti { position: absolute; top: calc(env(safe-area-inset-top, 0px) + var(--s3)); right: calc(env(safe-area-inset-right, 0px) + var(--s3) + 340px + var(--s3)); display: flex; gap: var(--s2); align-items: flex-start; flex-wrap: wrap; justify-content: flex-end; max-width: calc(100vw - 720px); }
.cerca { position: relative; width: 260px; }
.cerca input { width: 100%; height: 40px; padding: 0 var(--s3) 0 36px; border: 1px solid var(--filo); border-radius: 999px; background: var(--lastra); font-size: 14px; }
.cerca input::placeholder { color: var(--inchiostro-tenue); }
.cerca svg { position: absolute; left: 13px; top: 12px; width: 16px; height: 16px; stroke: var(--inchiostro-tenue); fill: none; stroke-width: 1.6; }
#risultati { position: absolute; top: 46px; left: 0; right: 0; padding: var(--s1); display: grid; z-index: 5; max-height: 360px; overflow: auto; }
#risultati button { all: unset; cursor: pointer; padding: 8px 12px; border-radius: var(--r-md); display: grid; gap: 2px; }
#risultati button:hover, #risultati button.attivo { background: var(--carta-scura); }
#risultati b { font-weight: 600; font-size: 14px; }
#risultati small { font-size: 12px; color: var(--inchiostro-tenue); font-variant-numeric: tabular-nums; }
.segmenti { display: inline-flex; padding: 3px; gap: 2px; border-radius: 999px; height: 40px; align-items: center; }
.segmenti button { border: 0; background: none; height: 32px; padding: 0 12px; border-radius: 999px; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--inchiostro-tenue); }
.segmenti button[aria-pressed="true"] { background: var(--inchiostro); color: var(--carta); }
.segmenti button:hover:not([aria-pressed="true"]) { color: var(--inchiostro); }
.bottone { height: 40px; padding: 0 var(--s3); border-radius: 999px; border: 1px solid var(--filo); background: var(--lastra); font-weight: 600; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: var(--s2); }
.bottone:hover { border-color: var(--inchiostro-tenue); }
.bottone.pieno { background: var(--terracotta); border-color: var(--terracotta); color: #fff8f2; }
:root[data-theme="dark"] .bottone.pieno { color: #1a1612; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .bottone.pieno { color: #1a1612; } }

/* Pannello */
#pannello { position: absolute; top: calc(env(safe-area-inset-top, 0px) + var(--s3)); right: calc(env(safe-area-inset-right, 0px) + var(--s3)); width: 340px; bottom: calc(env(safe-area-inset-bottom, 0px) + 128px); overflow: auto; padding: var(--s4); display: flex; flex-direction: column; gap: var(--s3); }
#pannello h2 { font: 800 30px/1 var(--f-display); letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
#pannello h3 { font: 700 15px/20px var(--f-display); margin: 0; }
#pannello p { font: 400 15px/23px var(--f-testo); margin: 0; }
.originale { font: italic 14px var(--f-testo); color: var(--inchiostro-tenue); margin-top: 6px; }
.dati { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s3) var(--s3); padding-block: var(--s3); border-block: 1px solid var(--filo); }
.dati div { display: grid; gap: 2px; min-width: 0; }
.dati dd { margin: 0; font: 700 20px/1.1 var(--f-display); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; overflow-wrap: anywhere; }
.dati dd small { font: 500 12px var(--f-ui); color: var(--inchiostro-tenue); letter-spacing: 0; }
.dati dt { order: -1; }
.precisione { display: inline-flex; gap: 3px; vertical-align: middle; }
.precisione i { width: 8px; height: 8px; border-radius: 50%; border: 1px solid var(--inchiostro-tenue); }
.precisione i.on { background: var(--inchiostro); border-color: var(--inchiostro); }
.grafico svg { width: 100%; height: 150px; display: block; overflow: visible; }
.grafico .asse text { font: 500 10px var(--f-ui); fill: var(--inchiostro-tenue); font-variant-numeric: tabular-nums; }
.grafico .asse line, .grafico .griglia line { stroke: var(--filo); }
.didascalia { font: 400 12px/17px var(--f-ui); color: var(--inchiostro-tenue); }
.link { color: var(--terracotta); font-weight: 600; font-size: 13px; text-decoration: none; }
.link:hover { text-decoration: underline; }
.indietro { all: unset; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--inchiostro-tenue); display: inline-flex; gap: 6px; align-items: center; }
.indietro:hover { color: var(--inchiostro); }
.classifica { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.classifica button { all: unset; cursor: pointer; display: grid; grid-template-columns: 22px 1fr auto; gap: var(--s2); align-items: center; width: 100%; padding: 7px 8px; border-radius: var(--r-md); box-sizing: border-box; }
.classifica button:hover { background: var(--carta-scura); }
.classifica .n { font: 700 12px var(--f-ui); color: var(--inchiostro-tenue); font-variant-numeric: tabular-nums; }
.classifica .nome { font-size: 14px; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.classifica .barra { grid-column: 2 / 4; height: 3px; border-radius: 2px; background: var(--carta-scura); overflow: hidden; }
.classifica .barra i { display: block; height: 100%; }
.classifica .km { font: 500 12px var(--f-ui); color: var(--inchiostro-tenue); font-variant-numeric: tabular-nums; }
.legenda { display: grid; gap: 6px; font-size: 13px; }
.legenda span { display: flex; align-items: center; gap: var(--s2); }
.legenda i { width: 18px; height: 12px; border-radius: 2px; border: 1px solid var(--filo); flex: none; }
.sovrano { all: unset; cursor: pointer; color: var(--terracotta); font-weight: 600; }
.sovrano:hover { text-decoration: underline; }
.assente { padding: var(--s3); border-radius: var(--r-md); background: var(--terracotta-chiara); font: 400 14px/20px var(--f-testo); }

/* Linea del tempo */
#tempo { position: absolute; left: calc(env(safe-area-inset-left, 0px) + var(--s3)); right: calc(env(safe-area-inset-right, 0px) + var(--s3)); bottom: calc(env(safe-area-inset-bottom, 0px) + var(--s3)); height: 100px; display: flex; align-items: stretch; gap: var(--s3); padding: var(--s2) var(--s3) var(--s2) var(--s2); }
.comandi { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; flex: none; }
#play { width: 52px; height: 52px; border-radius: 50%; border: 0; background: var(--inchiostro); color: var(--carta); cursor: pointer; display: grid; place-items: center; }
#play svg { width: 20px; height: 20px; fill: currentColor; }
#velocita { border: 0; background: none; font: 700 11px var(--f-ui); color: var(--inchiostro-tenue); cursor: pointer; font-variant-numeric: tabular-nums; padding: 2px 6px; border-radius: 999px; }
#velocita:hover { color: var(--inchiostro); background: var(--carta-scura); }
#linea { flex: 1; min-width: 0; position: relative; }
#linea svg { width: 100%; height: 100%; display: block; overflow: visible; touch-action: none; cursor: pointer; }
#linea .era-banda { fill: var(--carta-scura); }
#linea .era-banda.alt { fill: var(--filo); opacity: .45; }
#linea .era-nome { font: italic 400 12px var(--f-testo); fill: var(--inchiostro-tenue); }
#linea .tacca text { font: 600 10px var(--f-ui); fill: var(--inchiostro-tenue); font-variant-numeric: tabular-nums; }
#linea .tacca line { stroke: var(--inchiostro-tenue); opacity: .5; }
#linea .istantanea { fill: var(--inchiostro-tenue); }
#linea .istantanea.corrente { fill: var(--terracotta); }
#linea .evento { cursor: pointer; }
#linea .evento path { fill: var(--ocra); stroke: var(--carta); stroke-width: 1; }
#linea .evento:hover path { fill: var(--terracotta); }
#linea .cursore line { stroke: var(--terracotta); stroke-width: 2; }
#linea .cursore rect { fill: var(--terracotta); }
#linea .cursore text { font: 700 11px var(--f-ui); fill: #fff8f2; font-variant-numeric: tabular-nums; }
#linea .scia { fill: var(--terracotta); opacity: .12; }
#linea:focus-visible { outline: 2px solid var(--terracotta); outline-offset: 4px; border-radius: var(--r-md); }

/* Tooltip e didascalie */
#suggerimento { position: absolute; pointer-events: none; padding: 8px 12px; display: grid; gap: 2px; max-width: 260px; z-index: 8; border-radius: var(--r-md); transform: translate(14px, 14px); }
#suggerimento b { font: 700 14px/18px var(--f-display); }
#suggerimento small { font-size: 12px; color: var(--inchiostro-tenue); font-variant-numeric: tabular-nums; }
#racconto { position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 132px); transform: translateX(-50%); width: min(560px, calc(100vw - 32px)); padding: var(--s4); display: grid; gap: var(--s2); z-index: 6; animation: sale .5s cubic-bezier(.2,.8,.2,1); }
#racconto h3 { font: 800 26px/1.05 var(--f-display); margin: 0; letter-spacing: -0.02em; text-wrap: balance; }
#racconto p { font: 400 16px/25px var(--f-testo); margin: 0; }
#racconto .piede { display: flex; align-items: center; justify-content: space-between; gap: var(--s2); margin-top: var(--s2); }
#racconto .avanzamento { height: 2px; background: var(--filo); border-radius: 2px; overflow: hidden; }
#racconto .avanzamento i { display: block; height: 100%; width: 0; background: var(--terracotta); }
@keyframes sale { from { opacity: 0; transform: translate(-50%, 12px); } }
#caricamento { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font: italic 16px var(--f-testo); color: var(--inchiostro-tenue); }
#fonte { position: absolute; left: calc(env(safe-area-inset-left, 0px) + var(--s3)); bottom: calc(env(safe-area-inset-bottom, 0px) + 124px); max-width: calc(100vw - 420px); font-size: 11px; line-height: 15px; color: var(--inchiostro-tenue); }
#fonte a { color: inherit; }
#apri-pannello { display: none; }

@media (max-width: 1180px) {
  #strumenti { right: calc(env(safe-area-inset-right, 0px) + var(--s3) + 340px + var(--s3)); max-width: calc(100vw - 340px - 48px - 300px); }
  .cerca { width: 200px; }
}
@media (max-width: 860px) {
  #testata { min-width: 0; padding: 12px 16px; right: auto; }
  .anno strong { font-size: 44px; }
  .marchio span, .mappa-di { display: none; }
  #strumenti { top: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 128px); right: calc(env(safe-area-inset-right, 0px) + var(--s3)); left: calc(env(safe-area-inset-left, 0px) + var(--s3)); max-width: none; justify-content: flex-start; }
  .cerca { width: 100%; order: -1; }
  #risultati { top: auto; bottom: 46px; }
  #pannello { top: auto; left: calc(env(safe-area-inset-left, 0px) + var(--s3)); right: calc(env(safe-area-inset-right, 0px) + var(--s3)); width: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 128px); max-height: 52vh; z-index: 7; }
  #pannello[data-chiuso="true"] { display: none; }
  #apri-pannello { display: inline-flex; }
  #fonte { display: none; }
  #tempo { height: 96px; }
  #racconto { bottom: auto; top: calc(env(safe-area-inset-top, 0px) + 140px); }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; } }
</style>

<div id="app">
  <canvas id="map" aria-label="Mappa del mondo con i confini politici dell'anno selezionato"></canvas>
  <div id="caricamento">Sto preparando la carta…</div>

  <header id="testata" class="lastra">
    <div class="marchio"><b>Tempora<i>.</i></b><span>atlante storico del mondo</span></div>
    <div class="anno" aria-live="polite"><strong id="anno-num">1279</strong><em id="anno-era">d.C.</em></div>
    <div class="era" id="era-nome">Basso Medioevo</div>
    <div class="etichetta mappa-di" id="mappa-di">Confini del 1279</div>
  </header>

  <div id="strumenti">
    <div class="cerca">
      <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5"/><path d="M11 11l4 4"/></svg>
      <input id="cerca" type="search" placeholder="Cerca uno stato, un impero, un popolo" autocomplete="off" aria-label="Cerca un'entità storica" aria-controls="risultati">
      <div id="risultati" class="lastra" role="listbox" hidden></div>
    </div>
    <div class="segmenti lastra" role="group" aria-label="Proiezione">
      <button id="p-piano" aria-pressed="true">Piano</button>
      <button id="p-globo" aria-pressed="false">Globo</button>
    </div>
    <div class="segmenti lastra" role="group" aria-label="Colori della mappa">
      <button id="c-sovrani" aria-pressed="true" title="Uno stesso colore per un impero e i suoi territori dipendenti">Imperi</button>
      <button id="c-stati" aria-pressed="false" title="Un colore per ogni entità">Stati</button>
    </div>
    <button class="bottone" id="b-etichette" aria-pressed="true">Nomi</button>
    <button class="bottone" id="b-tema" aria-label="Cambia tema">Notte</button>
    <button class="bottone pieno" id="b-visita">
      <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 1l9 5-9 5z" fill="currentColor"/></svg>
      Visita guidata
    </button>
    <button class="bottone" id="apri-pannello">Dettagli</button>
  </div>

  <aside id="pannello" class="lastra" aria-live="polite" data-chiuso="true"></aside>

  <div id="fonte">Confini: <a href="https://github.com/aourednik/historical-basemaps" target="_blank" rel="noopener">historical-basemaps</a> (A. Ourednik, GPL-3.0) fino al 1880 · <a href="https://icr.ethz.ch/data/cshapes/" target="_blank" rel="noopener">CShapes 2.0</a> (ETH Zurigo, CC BY-NC-SA 4.0) dal 1886 · coste <a href="https://www.naturalearthdata.com/" target="_blank" rel="noopener">Natural Earth</a></div>

  <section id="tempo" class="lastra" aria-label="Linea del tempo">
    <div class="comandi">
      <button id="play" aria-label="Avvia lo scorrere del tempo"><svg viewBox="0 0 20 20"><path d="M5 3l12 7-12 7z"/></svg></button>
      <button id="velocita" aria-label="Velocità di riproduzione">1×</button>
    </div>
    <div id="linea" tabindex="0" role="slider" aria-label="Anno" aria-valuemin="-3000" aria-valuemax="2010" aria-valuenow="1279"></div>
  </section>

  <div id="suggerimento" class="lastra" hidden></div>
  <div id="racconto" class="lastra" hidden></div>
</div>

      <div class="etichetta">${propria && propria.cult ? "Popolo o cultura" : "Entità politica"}</div>
      <h2 style="margin-top:6px">${esc(nomeIt(nome))}</h2>
      ${IT[nome] ? `<div class="originale">${esc(nome)}</div>` : ""}
    </div>
    ${membri.length ? `
    <dl class="dati" style="margin:0">
      <div><dt class="etichetta">Estensione</dt><dd>${fmtKm(area)} <small>km²</small></dd></div>
      <div><dt class="etichetta">Posizione</dt><dd>${pos ? pos + "ª" : "—"} <small>per ampiezza</small></dd></div>
      <div><dt class="etichetta">Attestata</dt><dd style="font-size:15px">${ys.length ? `${fmtAnno(ys[0])} – ${fmtAnno(ys[ys.length - 1])}` : "—"}</dd></div>
      <div><dt class="etichetta">Confini</dt><dd style="font-size:15px">${prec ? `<span class="precisione" aria-label="precisione ${prec} su 3">${[1, 2, 3].map(i => `<i class="${i <= prec ? "on" : ""}"></i>`).join("")}</span> ${precTesto}` : "—"}</dd></div>
    </dl>
    ${sovrano ? `<p>Nel ${fmtAnno(s.anno)} è sotto il dominio di <button class="sovrano" data-sel="${esc(sovrano)}">${esc(nomeIt(sovrano))}</button>.</p>` : ""}
    ${dipendenti ? `<p>Controlla ${dipendenti} ${dipendenti === 1 ? "territorio dipendente" : "territori dipendenti"}, compresi nell'estensione.</p>` : ""}
    ` : `<div class="assente">Nel ${fmtAnno(s.anno)} questa entità non compare sulla carta. ${ys.length ? `È attestata dal ${fmtAnno(ys[0])} al ${fmtAnno(ys[ys.length - 1])}.` : ""}${eredi.length ? ` Sulla carta di quest'anno la stessa linea storica è ${eredi.map(n => `<button class="sovrano" data-sel="${esc(n)}">${esc(nomeIt(n))}</button>`).join(", ")}.` : ""}</div>`}
    <div class="grafico">
      <h3>Estensione nel tempo</h3>
      <p class="didascalia" style="margin:4px 0 8px">${serie.linea ? `Linea storica «${esc(serie.linea)}»: ${[...new Set(serie.membri.map(m => m.split(">")[0]).filter(m => !m.includes("(") && INDICE.entities[m]).map(nomeIt))].map(esc).join(", ")}. La parte scura è ${esc(nomeIt(nome))}.` : "Superficie su ogni carta disponibile."} Tocca il grafico per spostarti nel tempo.</p>
      <svg id="grafico" role="img" aria-label="Estensione in chilometri quadrati nel tempo"></svg>
    </div>
    <a class="link" href="${wiki}" target="_blank" rel="noopener">Leggi su Wikipedia ↗</a>`;
  $("#indietro").addEventListener("click", () => seleziona(null));
  p.querySelectorAll("[data-sel]").forEach(b => b.addEventListener("click", () => seleziona(b.dataset.sel, { vola: true })));
  disegnaGrafico(serie);
}
function disegnaGrafico(serie) {
  const svg = d3.select("#grafico"); const w = svg.node().clientWidth || 290, h = 150, m = { t: 10, r: 6, b: 20, l: 36 };
  svg.attr("viewBox", `0 0 ${w} ${h}`);
  const x = d3.scaleLinear().domain([0, 1]).range([m.l, w - m.r]);
  const max = d3.max(serie.punti, d => d.a || 0) || 1;
  const y = d3.scaleLinear().domain([0, max]).nice(3).range([h - m.b, m.t]);
  const X = d => x(tScala(d.y));
  const g = svg.append("g");
  g.append("g").attr("class", "griglia").selectAll("line").data(y.ticks(3)).join("line").attr("x1", m.l).attr("x2", w - m.r).attr("y1", y).attr("y2", y);
  g.append("g").attr("class", "asse").selectAll("text").data(y.ticks(3)).join("text").attr("x", m.l - 6).attr("y", d => y(d) + 3).attr("text-anchor", "end").text(d => d >= 1e6 ? (d / 1e6).toLocaleString("it-IT") + " mln" : d >= 1e3 ? (d / 1e3) + " k" : d);
  g.append("g").attr("class", "asse").selectAll("text.x").data([-3000, 1, 1000, 2000]).join("text").attr("x", d => x(tScala(d))).attr("y", h - 4).attr("text-anchor", "middle").text(d => d < 0 ? `${-d} a.C.` : d === 1 ? "1 d.C." : d);
  const area = d3.area().defined(d => d.a != null).curve(d3.curveStepAfter).x(X).y0(y(0)).y1(d => y(d.a));
  g.append("path").datum(serie.punti).attr("d", area).attr("fill", colori.terracotta).attr("opacity", serie.linea ? 0.22 : 0.3);
  if (serie.linea) {
    const mia = d3.area().defined(d => d.mia != null).curve(d3.curveStepAfter).x(X).y0(y(0)).y1(d => y(d.mia));
    g.append("path").datum(serie.punti).attr("d", mia).attr("fill", colori.terracotta).attr("opacity", 0.55);
  }
  g.append("path").datum(serie.punti).attr("d", d3.line().defined(d => d.a != null).curve(d3.curveStepAfter).x(X).y(d => y(d.a))).attr("fill", "none").attr("stroke", colori.terracotta).attr("stroke-width", 1.5);
  const cx = x(tScala(S.anno));
  g.append("line").attr("x1", cx).attr("x2", cx).attr("y1", m.t - 4).attr("y2", h - m.b).attr("stroke", colori.inchiostro).attr("stroke-width", 1);
  const cur = serie.punti.find(d => d.y === S.istantanea.anno);
  if (cur && cur.a != null) g.append("circle").attr("cx", X(cur)).attr("cy", y(cur.a)).attr("r", 3.5).attr("fill", colori.terracotta).attr("stroke", colori.carta).attr("stroke-width", 1.5);
  svg.on("click", ev => {
    const [px] = d3.pointer(ev);
    const yr = tScala.invert(x.invert(px));
    impostaAnno(yr);
  }).style("cursor", "pointer");
}

/* ───────────────────────── Linea del tempo ───────────────────────── */
let linea = null;
function creaLinea() {
  const box = $("#linea");
  const svg = d3.select(box).append("svg");
  const gEre = svg.append("g"), gTacche = svg.append("g"), gScia = svg.append("rect").attr("class", "scia"), gSnap = svg.append("g"), gEv = svg.append("g"), gCur = svg.append("g").attr("class", "cursore");
  gCur.append("line"); gCur.append("rect").attr("rx", 3); gCur.append("text").attr("text-anchor", "middle");
  let w = 0, h = 0, x = null;
  const Y_ERE = 4, H_ERE = 20;
  function ridisegna() {
    w = box.clientWidth; h = box.clientHeight;
    svg.attr("viewBox", `0 0 ${w} ${h}`);
    x = v => 6 + tScala(v) * (w - 12);
    const asse = h - 30;
    gEre.selectAll("*").remove();
    ERE.forEach((e, i) => {
      const x0 = x(e[0]), x1 = x(e[1]);
      gEre.append("rect").attr("class", "era-banda" + (i % 2 ? " alt" : "")).attr("x", x0).attr("y", Y_ERE).attr("width", Math.max(0, x1 - x0 - 1)).attr("height", H_ERE).attr("rx", 3);
      const t = gEre.append("text").attr("class", "era-nome").attr("x", x0 + 6).attr("y", Y_ERE + 14).text(e[2]);
      if (t.node().getComputedTextLength() > x1 - x0 - 10) t.remove();
    });
    const tacche = w < 420 ? [-3000, 1, 1000, 1500, 2000] : w < 600 ? [-3000, -1000, 1, 1000, 1500, 1800, 2000] : [-3000, -2000, -1000, -500, 1, 500, 1000, 1250, 1500, 1650, 1800, 1900, 2000];
    gTacche.selectAll("*").remove();
    for (const t of tacche) {
      const g = gTacche.append("g").attr("class", "tacca");
      g.append("line").attr("x1", x(t)).attr("x2", x(t)).attr("y1", asse - 3).attr("y2", asse + 3);
      g.append("text").attr("x", x(t)).attr("y", asse + 17).attr("text-anchor", "middle").text(t < 0 ? `${-t} a.C.` : t === 1 ? "1 d.C." : t);
    }
    gTacche.append("line").attr("x1", x(-3000)).attr("x2", x(2010)).attr("y1", asse).attr("y2", asse).attr("stroke", colori.filo || "#d9cbb4");
    gSnap.selectAll("*").remove();
    gSnap.selectAll("circle").data(ANNI).join("circle").attr("class", "istantanea").attr("cx", d => x(d)).attr("cy", asse).attr("r", 2.2);
    gEv.selectAll("*").remove();
    const ev = gEv.selectAll("g").data(EVENTI).join("g").attr("class", "evento").attr("transform", d => `translate(${x(d[0])},${asse - 10})`);
    ev.append("path").attr("d", "M0,-5 L4,0 L0,5 L-4,0 Z");
    ev.append("rect").attr("x", -7).attr("y", -9).attr("width", 14).attr("height", 18).attr("fill", "transparent");
    ev.append("title").text(d => `${fmtAnno(d[0])} · ${d[1]}`);
    ev.on("pointerdown", ev => ev.stopPropagation()).on("click", (ev, d) => { ev.stopPropagation(); vaiEvento(d); });
    cursore();
  }
  function cursore() {
    if (!x) return;
    const asse = h - 30, cx = x(S.anno);
    gCur.select("line").attr("x1", cx).attr("x2", cx).attr("y1", Y_ERE).attr("y2", asse + 6);
    const testo = fmtAnno(S.anno);
    const tw = testo.length * 6.6 + 12;
    const rx = clamp(cx - tw / 2, 0, w - tw);
    gCur.select("rect").attr("x", rx).attr("y", Y_ERE + H_ERE + 2).attr("width", tw).attr("height", 17);
    gCur.select("text").attr("x", rx + tw / 2).attr("y", Y_ERE + H_ERE + 14).text(testo);
    gSnap.selectAll("circle").attr("class", d => "istantanea" + (S.istantanea && d === S.istantanea.anno ? " corrente" : "")).attr("r", d => S.istantanea && d === S.istantanea.anno ? 4 : 2.2);
    if (S.istantanea) {
      const i = ANNI.indexOf(S.istantanea.anno), fine = ANNI[i + 1] != null ? ANNI[i + 1] : 2010;
      gScia.attr("x", x(S.istantanea.anno)).attr("width", Math.max(0, x(fine) - x(S.istantanea.anno))).attr("y", Y_ERE).attr("height", asse - Y_ERE);
    }
  }
  const annoDa = px => tScala.invert(clamp((px - 6) / (w - 12), 0, 1));
  let trascina = false;
  svg.on("pointerdown", ev => { trascina = true; svg.node().setPointerCapture(ev.pointerId); fermaTour(); impostaAnno(annoDa(d3.pointer(ev)[0])); })
    .on("pointermove", ev => { if (trascina) impostaAnno(annoDa(d3.pointer(ev)[0])); })
    .on("pointerup pointercancel", () => { trascina = false; });
  box.addEventListener("keydown", ev => {
    const i = ANNI.indexOf(istantaneaPer(S.anno));
    if (ev.key === "ArrowRight") { ev.preventDefault(); impostaAnno(ANNI[Math.min(ANNI.length - 1, i + 1)]); }
    else if (ev.key === "ArrowLeft") { ev.preventDefault(); impostaAnno(S.anno > ANNI[i] ? ANNI[i] : ANNI[Math.max(0, i - 1)]); }
    else if (ev.key === "Home") { ev.preventDefault(); impostaAnno(-3000); }
    else if (ev.key === "End") { ev.preventDefault(); impostaAnno(2010); }
  });
  return { ridisegna, cursore };
}

/* ───────────────────────── Riproduzione ───────────────────────── */
const VEL = [0.5, 1, 2, 4];
let ultimoTick = 0;
function tick(now) {
  if (!S.play) return;
  const dt = Math.min(0.1, (now - ultimoTick) / 1000); ultimoTick = now;
  const u = tScala(S.anno) + dt * S.vel / 70; // 70 s per attraversare tutta la storia a 1×
  if (u >= 1) { impostaAnno(2010); suona(false); return; }
  impostaAnno(tScala.invert(u));
  requestAnimationFrame(tick);
}
function suona(on) {
  S.play = on;
  $("#play").innerHTML = on ? '<svg viewBox="0 0 20 20"><path d="M5 3h3.5v14H5zM11.5 3H15v14h-3.5z"/></svg>' : '<svg viewBox="0 0 20 20"><path d="M5 3l12 7-12 7z"/></svg>';
  $("#play").setAttribute("aria-label", on ? "Ferma lo scorrere del tempo" : "Avvia lo scorrere del tempo");
  if (on) { if (S.anno >= 2010) impostaAnno(-3000, { animare: false }); ultimoTick = performance.now(); requestAnimationFrame(tick); }
}

/* ───────────────────────── Visita guidata ───────────────────────── */
const TAPPE = EVENTI.filter(e => e[4]);
let tourTimer = null;
function vaiEvento(e) {
  suona(false);
  impostaAnno(e[0]);
  if (e[3]) volaA(e[3][0], e[3][1], e[3][2]);
}
function mostraTappa(i) {
  const e = TAPPE[i]; S.tour = i;
  vaiEvento(e);
  seleziona(null);
  const r = $("#racconto");
  r.hidden = false;
  r.innerHTML = `<div class="etichetta">${fmtAnno(e[0])} · Tappa ${i + 1} di ${TAPPE.length}</div>
    <h3>${esc(e[1])}</h3><p>${esc(e[2])}</p>
    <div class="avanzamento"><i></i></div>
    <div class="piede">
      <button class="bottone" id="t-esci">Esci dalla visita</button>
      <span style="display:flex;gap:8px">
        <button class="bottone" id="t-prec" ${i === 0 ? "disabled" : ""}>Indietro</button>
        <button class="bottone pieno" id="t-succ">${i === TAPPE.length - 1 ? "Fine" : "Avanti"}</button>
      </span>
    </div>`;
  r.style.animation = "none"; void r.offsetWidth; r.style.animation = "";
  $("#t-esci").onclick = fermaTour;
  $("#t-prec").onclick = () => mostraTappa(i - 1);
  $("#t-succ").onclick = () => i === TAPPE.length - 1 ? fermaTour() : mostraTappa(i + 1);
  const barra = r.querySelector(".avanzamento i");
  clearTimeout(tourTimer);
  const durata = 11000;
  if (!riduciMoto) { barra.style.transition = "none"; barra.style.width = "0"; requestAnimationFrame(() => { barra.style.transition = `width ${durata}ms linear`; barra.style.width = "100%"; }); }
  tourTimer = setTimeout(() => { if (S.tour === i && i < TAPPE.length - 1) mostraTappa(i + 1); }, durata);
}
function fermaTour() { if (S.tour == null) return; S.tour = null; clearTimeout(tourTimer); $("#racconto").hidden = true; }

/* ───────────────────────── Ricerca ───────────────────────── */
function creaRicerca() {
  const input = $("#cerca"), box = $("#risultati");
  const voci = Object.keys(INDICE.entities).map(n => {
    const ys = Object.keys(INDICE.entities[n]).map(Number).sort((a, b) => a - b);
    const max = Math.max(...Object.values(INDICE.entities[n]));
    return { n, it: nomeIt(n), ys, max, chiave: (n + " " + nomeIt(n)).toLowerCase() };
  });
  let attivi = [], idx = 0;
  const mostra = () => {
    const q = input.value.trim().toLowerCase();
    if (q.length < 2) { box.hidden = true; return; }
    attivi = voci.filter(v => v.chiave.includes(q)).sort((a, b) => (b.it.toLowerCase().startsWith(q) - a.it.toLowerCase().startsWith(q)) || b.max - a.max).slice(0, 8);
    idx = 0;
    box.innerHTML = attivi.length ? attivi.map((v, i) => `<button role="option" data-i="${i}" class="${i === 0 ? "attivo" : ""}"><b>${esc(v.it)}</b><small>${fmtAnno(v.ys[0])} – ${fmtAnno(v.ys[v.ys.length - 1])} · fino a ${fmtKm(v.max)} km²</small></button>`).join("") : `<p class="didascalia" style="padding:8px 12px;margin:0">Nessuna entità con questo nome. Prova in inglese: i nomi originali vengono dal dataset.</p>`;
    box.hidden = false;
    box.querySelectorAll("button").forEach(b => b.addEventListener("click", () => scegli(attivi[+b.dataset.i])));
  };
  const scegli = v => {
    if (!v) return;
    box.hidden = true; input.value = v.it; input.blur();
    fermaTour(); suona(false);
    const presente = v.ys.includes(istantaneaPer(S.anno));
    const anno = presente ? S.anno : v.ys.reduce((b, y) => INDICE.entities[v.n][y] > INDICE.entities[v.n][b] ? y : b, v.ys[0]);
    impostaAnno(anno).then(() => seleziona(v.n, { vola: true }));
    if (presente) seleziona(v.n, { vola: true });
  };
  input.addEventListener("input", mostra);
  input.addEventListener("keydown", ev => {
    if (box.hidden) return;
    const bs = box.querySelectorAll("button");
    if (ev.key === "ArrowDown" || ev.key === "ArrowUp") { ev.preventDefault(); idx = clamp(idx + (ev.key === "ArrowDown" ? 1 : -1), 0, bs.length - 1); bs.forEach((b, i) => b.classList.toggle("attivo", i === idx)); }
    else if (ev.key === "Enter") { ev.preventDefault(); scegli(attivi[idx]); }
    else if (ev.key === "Escape") { box.hidden = true; }
  });
  document.addEventListener("click", ev => { if (!ev.target.closest(".cerca")) box.hidden = true; });
}

/* ───────────────────────── Comandi ───────────────────────── */
function premi(attivo, altro) { attivo.setAttribute("aria-pressed", "true"); altro.setAttribute("aria-pressed", "false"); }
function impostaProiezione(p) {
  S.proj = p; salva("proj", p);
  premi($(p === "piano" ? "#p-piano" : "#p-globo"), $(p === "piano" ? "#p-globo" : "#p-piano"));
  S.anim = null; vista = d3.zoomIdentity; globoK = 1; ultimaT = d3.zoomIdentity;
  zoom.scaleExtent(p === "piano" ? [1, 40] : [0.8, 14]);
  d3.select(canvas).call(zoom.transform, d3.zoomIdentity);
  disegna();
}
function impostaModo(m) {
  S.modo = m; salva("modo", m);
  premi($(m === "s" ? "#c-sovrani" : "#c-stati"), $(m === "s" ? "#c-stati" : "#c-sovrani"));
  aggiornaPannello(); disegna();
}
function temaCorrente() { return document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); }
function aggiornaTema() {
  leggiColori();
  $("#b-tema").textContent = temaCorrente() === "dark" ? "Carta" : "Notte";
  aggiornaPannello(); disegna(); if (linea) linea.ridisegna();
}
$("#p-piano").onclick = () => impostaProiezione("piano");
$("#p-globo").onclick = () => impostaProiezione("globo");
$("#c-sovrani").onclick = () => impostaModo("s");
$("#c-stati").onclick = () => impostaModo("n");
$("#b-etichette").onclick = ev => { S.nomi = !S.nomi; ev.currentTarget.setAttribute("aria-pressed", String(S.nomi)); ev.currentTarget.style.opacity = S.nomi ? 1 : .6; disegna(); };
$("#b-tema").onclick = () => { const t = temaCorrente() === "dark" ? "light" : "dark"; document.documentElement.dataset.theme = t; salva("tema", t); aggiornaTema(); };
$("#b-visita").onclick = () => { suona(false); mostraTappa(0); };
$("#apri-pannello").onclick = () => { S.pannelloAperto = !S.pannelloAperto; aggiornaPannello(); };
$("#play").onclick = () => { fermaTour(); suona(!S.play); };
$("#velocita").onclick = ev => { S.vel = VEL[(VEL.indexOf(S.vel) + 1) % VEL.length]; ev.currentTarget.textContent = String(S.vel).replace(".", ",") + "×"; };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", aggiornaTema);
document.addEventListener("keydown", ev => {
  if (ev.target.closest("input")) return;
  if (ev.key === " " && !ev.target.closest("button")) { ev.preventDefault(); fermaTour(); suona(!S.play); }
  if (ev.key === "Escape") { fermaTour(); if (S.sel) seleziona(null); }
});
window.addEventListener("resize", () => { clearTimeout(window._rz); window._rz = setTimeout(ridimensiona, 80); });
window.addEventListener("hashchange", () => { const y = annoDaHash(); if (y != null && y !== S.anno) impostaAnno(y); });

/* ───────────────────────── Avvio ───────────────────────── */
(async function avvia() {
  const t = leggi("tema"); if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
  leggiColori();
  $("#b-tema").textContent = temaCorrente() === "dark" ? "Carta" : "Notte";
  if (W < 860 && innerWidth >= 860) S.pannelloAperto = true;
  S.pannelloAperto = innerWidth >= 860;
  try {
    INDICE = await fetch("data/index.json").then(r => r.json());
  } catch (e) {
    $("#caricamento").textContent = "Non riesco a caricare le carte. Ricarica la pagina per riprovare.";
    return;
  }
  ANNI = INDICE.years.slice().sort((a, b) => a - b);
  try {
    const t50 = await fetch("data/terra-50.json").then(r => r.json());
    TERRA.g50 = topojson.merge(t50, Object.values(t50.objects)[0].geometries);
  } catch (e) {}
  linea = creaLinea();
  ridimensiona();
  creaRicerca();
  const m = leggi("modo"); if (m === "n") impostaModo("n");
  const p = leggi("proj"); if (p === "globo") impostaProiezione("globo");
  const y0 = annoDaHash();
  await impostaAnno(y0 != null ? y0 : 1279, { animare: false });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { disegna(); linea.ridisegna(); });
})();
</script>
